name: Build and Test

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  ANDROID_USER_HOME: /home/runner/.android
  ANDROID_EMULATOR_HOME: /home/runner/.android
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  run_tests:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run Unit Tests
        run: ./gradlew testDebug
      - name: Download emu image and platform tools
        run: echo "yes" | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"
      - name: Setup emu
        run: ./gradlew sampleapp:pixel5api35Setup
      - name: Run UI Tests
        run: ./gradlew sampleapp:pixel5api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

  publish_release:
    name: Publish Release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [run_tests]
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 17
          distribution: temurin
      - name: Determine version and publish task
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "task=publishAndReleaseToMavenCentral" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags HEAD)-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "task=publishToMavenCentral" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Maven Central
        run: ./gradlew "$PUBLISH_TASK"
        env:
          PUBLISH_TASK: ${{ steps.release.outputs.task }}
          ORG_GRADLE_PROJECT_kherkinVersion: ${{ steps.release.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
